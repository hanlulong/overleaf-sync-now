name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly run so a dependency release (playwright, patchright, requests,
  # browser-cookie3, rookiepy) that breaks install or the suite is noticed
  # even when nothing is pushed.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Full version sweep on Linux: the requires-python >=3.10 claim and the
        # rookiepy python_version/platform marker only get exercised by a real
        # multi-version install.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # The tool is developed on Windows and macOS/Linux are under-tested;
          # smoke the install + suite on each at one version.
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Editable install pulls the runtime deps so `import overleaf_sync_now`
      # (which imports requests transitively) works — bare `unittest` would
      # fail with ModuleNotFoundError otherwise. No browser binary is needed:
      # the suite monkeypatches every network/cookie path.
      - name: Install (editable, with deps)
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover tests -v

  build:
    name: build & metadata check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      # Validates the dynamic-version wiring ([tool.setuptools.dynamic] attr),
      # the PEP 639 license metadata, and the SKILL.md package-data inclusion
      # before a release tag.
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel ships SKILL.md
        shell: bash
        run: python -c "import sys, zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'overleaf_sync_now/SKILL.md' in names else 1)"
